<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会議の時間コスト計算機</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #616e7c;
    --border: #d9e2ec;
    --accent: #2563eb;
    --result: #0f766e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d;
      --card: #1b222b;
      --text: #e6edf3;
      --muted: #9aa7b4;
      --border: #2d3743;
      --accent: #60a5fa;
      --result: #2dd4bf;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 20px; font-size: .9rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  label { display: block; font-weight: 600; font-size: .9rem; margin-top: 14px; }
  label:first-child { margin-top: 0; }
  .field { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    font-size: 1rem;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .unit { color: var(--muted); min-width: 3.5em; font-size: .9rem; }
  .result { margin-top: 20px; text-align: center; }
  .result .label { color: var(--muted); font-size: .85rem; }
  .total { font-size: 2.2rem; font-weight: 700; color: var(--result); word-break: break-all; }
  .detail { color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .error { color: #dc2626; font-size: .85rem; min-height: 1.2em; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>会議の時間コスト計算機</h1>
  <p class="lead">参加人数・時間・1時間あたりの単価を入力すると、会議の合計コストが分かります。</p>

  <div class="card">
    <label for="people">参加人数</label>
    <div class="field">
      <input id="people" type="number" inputmode="numeric" min="0" step="1" value="5">
      <span class="unit">人</span>
    </div>

    <label for="hours">会議の時間</label>
    <div class="field">
      <input id="hours" type="number" inputmode="decimal" min="0" step="0.25" value="1">
      <span class="unit">時間</span>
    </div>

    <label for="rate">1時間あたりの単価（1人あたり）</label>
    <div class="field">
      <input id="rate" type="number" inputmode="numeric" min="0" step="100" value="5000">
      <span class="unit">円</span>
    </div>

    <div class="error" id="error" role="alert"></div>

    <div class="result" aria-live="polite">
      <div class="label">合計コスト</div>
      <div class="total" id="total">¥25,000</div>
      <div class="detail" id="detail">5人 × 1時間 × ¥5,000</div>
    </div>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const yen = new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY", maximumFractionDigits: 0 });
  const num = new Intl.NumberFormat("ja-JP", { maximumFractionDigits: 2 });

  function calc() {
    const people = parseFloat($("people").value);
    const hours = parseFloat($("hours").value);
    const rate = parseFloat($("rate").value);
    const values = [people, hours, rate];

    if (values.some((v) => Number.isNaN(v))) {
      $("error").textContent = "すべての項目を入力してください。";
      $("total").textContent = "—";
      $("detail").textContent = "";
      return;
    }
    if (values.some((v) => v < 0)) {
      $("error").textContent = "0以上の数値を入力してください。";
      $("total").textContent = "—";
      $("detail").textContent = "";
      return;
    }

    $("error").textContent = "";
    $("total").textContent = yen.format(people * hours * rate);
    $("detail").textContent = `${num.format(people)}人 × ${num.format(hours)}時間 × ${yen.format(rate)}`;
  }

  ["people", "hours", "rate"].forEach((id) => $(id).addEventListener("input", calc));
  calc();
</script>
</body>
</html>
